#
# Airymax Rust Agent workspace root.
# See docs-closed/agentrt/01-designs/airymax-agent-standard.md §9.

[workspace]
resolver = "2"
members = [
    "crates/agent-core",
    "crates/agent-ffi",
    "crates/agent-contract",
    "crates/coding_agent",
]

[workspace.package]
version = "0.1.2"
edition = "2021"
rust-version = "1.75"
license = "AGPL-3.0-or-later OR Apache-2.0"
authors = ["SPHARX Ltd. <dev@spharx.cn>"]
repository = "https://github.com/spharx/airymax"
description = "Airymax Rust Agent execution skeleton (agentrt-aligned)"

[workspace.dependencies]
agent-core = { path = "crates/agent-core" }
agent-ffi = { path = "crates/agent-ffi" }
agent-contract = { path = "crates/agent-contract" }

serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
tokio = { version = "1.40", features = ["full"] }
thiserror = "1.0"
tracing = "0.1"
libc = "0.2"
async-trait = "0.1"

[profile.release]
opt-level = 3
lto = "thin"
