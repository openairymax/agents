# =============================================================================
# Airymax Agent 执行体注册表 — 运行时单一可信源
# 版本: v1.0.0
# 最后更新: 2026-07-31
# 规范: docs/AirymaxRT/20-modules/10-contracts/01-agent-contract.md (v1.0.0)
# Schema: shared/contracts/agent.schema.json
# =============================================================================
# 本文件是运行时（agent_d / sched_d / sdk-python）查询执行体清单的入口。
# 仅保留运行时路由所需的最小字段；完整契约（capabilities 的 input/output
# schema、cost_profile、trust_metrics 等）请查阅各 Agent 的 contract.json。
#
# 与 ecosystem/manager/agent/registry.yaml 的关系：
#   - manager/agent/registry.yaml 保留 _owner / _metadata / 资源限制 / 信任指标
#     等运维侧字段，归 Manager 模块治理。
#   - 本文件聚焦执行体本身（agent_id / role / contract_path / enabled），
#     归 Airymax Agent 标准治理。
# =============================================================================

