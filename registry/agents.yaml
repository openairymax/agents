# =============================================================================
# 字段说明
# =============================================================================
# - agent_id: 全局唯一标识 (`<role>_v<major>`)，须与 contract.json 一致
# - role: 角色分类（snake_case），须为 agent_id 去掉 `_v<n>` 后缀
# - source: builtin（内置）/ external（外部安装）/ custom（用户自定义）
# - language: 实现语言（python / rust / c / mixed）
# - version: 实现版本（SemVer），planned Agent 用 "0.0.0"
# - enabled: 运行时是否可被 agent_d spawn
# - implementation_status: implemented / planned / experimental / deprecated
# - contract_path: 相对仓库根的 contract.json 路径；planned Agent 暂为 null
# - description: 一句话功能描述（与 contract.json.description 保持一致）
